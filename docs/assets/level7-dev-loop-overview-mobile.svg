<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="level7-mobile-title level7-mobile-desc">
  <title id="level7-mobile-title">Level 7 Dev Loop mobile workflow overview</title>
  <desc id="level7-mobile-desc">One development intent moves through inspection, implementation, testing, repair, self-review, and handoff. Process grows from code and tests at Tier 1 to one concise brief at Tier 2 and stronger verification, rollback, and effect-boundary authority at Tier 3.</desc>
  <defs>
    <marker id="level7-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="640" height="820" rx="28" fill="#0B1220"/>
  <rect x="1" y="1" width="638" height="818" rx="27" fill="none" stroke="#233148" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="52" fill="#F8FAFC" font-size="34" font-weight="700">One intent. One development loop.</text>
    <text x="40" y="86" fill="#B8C4D6" font-size="20">Keep routine work moving.</text>
    <text x="40" y="112" fill="#B8C4D6" font-size="20">Add process only when risk earns it.</text>

    <g fill="none" stroke="#2DD4BF" stroke-width="4" marker-end="url(#level7-mobile-arrow)">
      <path d="M290 176 H344"/>
      <path d="M475 207 V229"/>
      <path d="M350 266 H296"/>
      <path d="M165 297 V319"/>
      <path d="M290 356 H344"/>
      <path d="M475 387 V409"/>
    </g>

    <g font-size="22" font-weight="650" text-anchor="middle">
      <g>
        <rect x="40" y="145" width="250" height="62" rx="14" fill="#132238" stroke="#2DD4BF" stroke-width="2"/>
        <text x="165" y="183" fill="#F8FAFC">1 · Intent</text>
      </g>
      <g>
        <rect x="350" y="145" width="250" height="62" rx="14" fill="#132238" stroke="#334155" stroke-width="2"/>
        <text x="475" y="183" fill="#F8FAFC">2 · Inspect</text>
      </g>
      <g>
        <rect x="350" y="235" width="250" height="62" rx="14" fill="#132238" stroke="#334155" stroke-width="2"/>
        <text x="475" y="273" fill="#F8FAFC">3 · Implement</text>
      </g>
      <g>
        <rect x="40" y="235" width="250" height="62" rx="14" fill="#132238" stroke="#334155" stroke-width="2"/>
        <text x="165" y="273" fill="#F8FAFC">4 · Test</text>
      </g>
      <g>
        <rect x="40" y="325" width="250" height="62" rx="14" fill="#132238" stroke="#334155" stroke-width="2"/>
        <text x="165" y="363" fill="#F8FAFC">5 · Repair</text>
      </g>
      <g>
        <rect x="350" y="325" width="250" height="62" rx="14" fill="#132238" stroke="#334155" stroke-width="2"/>
        <text x="475" y="363" fill="#F8FAFC">6 · Self-review</text>
      </g>
      <g>
        <rect x="350" y="415" width="250" height="62" rx="14" fill="#132238" stroke="#2DD4BF" stroke-width="2"/>
        <text x="475" y="453" fill="#F8FAFC">7 · Handoff</text>
      </g>
    </g>

    <g>
      <rect x="40" y="520" width="560" height="74" rx="16" fill="#101B2D" stroke="#334155" stroke-width="2"/>
      <rect x="60" y="540" width="76" height="30" rx="15" fill="#18334A"/>
      <text x="98" y="561" fill="#67E8F9" font-size="16" font-weight="700" text-anchor="middle">TIER 1</text>
      <text x="156" y="562" fill="#F8FAFC" font-size="20" font-weight="600">Routine: code + tests. No governance artifact.</text>

      <rect x="40" y="610" width="560" height="74" rx="16" fill="#101B2D" stroke="#334155" stroke-width="2"/>
      <rect x="60" y="630" width="76" height="30" rx="15" fill="#203050"/>
      <text x="98" y="651" fill="#A5B4FC" font-size="16" font-weight="700" text-anchor="middle">TIER 2</text>
      <text x="156" y="652" fill="#F8FAFC" font-size="20" font-weight="600">Product change: one brief + verification.</text>

      <rect x="40" y="700" width="560" height="88" rx="16" fill="#171A25" stroke="#FBBF24" stroke-width="2"/>
      <rect x="60" y="720" width="76" height="30" rx="15" fill="#3A2B12"/>
      <text x="98" y="741" fill="#FCD34D" font-size="16" font-weight="700" text-anchor="middle">TIER 3</text>
      <text x="156" y="737" fill="#F8FAFC" font-size="20" font-weight="600">High risk: stronger checks + rollback.</text>
      <text x="156" y="765" fill="#E7D7AB" font-size="19">Authority at the real effect boundary.</text>
    </g>
  </g>
</svg>
