name: Harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go ${{ matrix.go-version }} (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: baseline
            go-version: 1.26.7
            experimental: false
          - role: shadow
            go-version: 1.27.0
            experimental: true
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap authenticated Go archive
        run: make bootstrap GO_VERSION=${{ matrix.go-version }}

      - name: Verify technical harness and distribution offline
        run: make ci GO_VERSION=${{ matrix.go-version }}

  cli-macos:
    name: CLI macOS 15 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap authenticated Go archive
        run: make bootstrap GO_VERSION=1.26.7

      - name: Verify inert CLI and distribution offline
        run: make ci GO_VERSION=1.26.7

      - name: Cross-build declared macOS architectures
        run: make cli-cross-build GO_VERSION=1.26.7

  cli-benchmark:
    name: CLI paired benchmark gate
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: base
          persist-credentials: false

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          path: candidate
          persist-credentials: false

      - name: Bootstrap authenticated Go archive
        working-directory: candidate
        run: make bootstrap GO_VERSION=1.26.7

      - name: Compare paired same-host medians
        working-directory: candidate
        env:
          L7_BENCHMARK_BASE_ROOT: ${{ github.workspace }}/base
        run: make cli-benchmark-check GO_VERSION=1.26.7
