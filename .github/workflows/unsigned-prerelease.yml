            .total_count == 1 and (.artifacts | length) == 1 and (.artifacts[0].id | tostring) == $id' >/dev/null

          expected=$(printf '%s\n' SHA256SUMS UNSIGNED-PRERELEASE-MANIFEST.json \
            level7-dev-loop-1.0.0-dev-claude.zip level7-dev-loop-1.0.0-dev-codex.zip | sort)
          observed=$(find prepared -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$observed" = "$expected"
          test -z "$(find prepared -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find prepared -type f -size +300M -print -quit)"
          test "$(find prepared -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          (cd prepared && shasum -a 256 -c SHA256SUMS)

          manifest=prepared/UNSIGNED-PRERELEASE-MANIFEST.json
          jq -e \
            --arg base "$L7_RELEASE_BASE" --arg commit "$CANDIDATE_COMMIT" --arg tree "$CANDIDATE_TREE" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            keys == ["actual_host_lifecycle_at_preparation","artifact_state","artifacts","authority","candidate","change_id","channel","checksums","developer_id_signing","distribution_purpose","gatekeeper","next","notarization","post_preparation_host_evidence_required","provider_execution","provider_qualification","publication_blocked","release_notes","retained_releases","schema","stable_v1_evidence_or_authority","support","tag","unsigned_inputs","unsigned_packages","version","workflow"] and
            .schema == 1 and .change_id == "l7-v1-explicitly-unsigned-prerelease" and
            .version == "1.0.0-dev" and .channel == "development-candidate" and .tag == "v1.0.0-dev" and
            (.candidate | keys) == ["base","commit","pull_request","tree"] and
            .candidate.base == $base and .candidate.commit == $commit and .candidate.tree == $tree and
            (.candidate.pull_request | type == "number" and . >= 1) and
            (.workflow | keys) == ["repository","run_attempt","run_id"] and
            .workflow.repository == $repository and .workflow.run_id == $run and .workflow.run_attempt == $attempt and
