            "repos/${GITHUB_REPOSITORY}/actions/workflows/unsigned-prerelease.yml/runs?event=workflow_dispatch&head_sha=${CANDIDATE_COMMIT}&per_page=100" \
            --jq '.workflow_runs[]')
          printf '%s\n' "$dispatches" | jq -sce \
            --arg id "$GITHUB_RUN_ID" --arg sha "$CANDIDATE_COMMIT" --arg title "$expected_run_name" '
