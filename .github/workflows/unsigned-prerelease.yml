          test "$(printf '%s' "$v011_ref" | jq -r .object.sha)" = 1353a5b0089e8e3c2fdcd7ed591a875661f68b9c
          test "$(printf '%s' "$v011_tag" | jq -r .object.sha)" = 6757cc34d3bf9e05599387101bfc643e1fe4fee3
          v010_normalized=$(printf '%s' "$v010_release" | jq -c \
