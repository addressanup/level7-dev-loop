name: Explicitly unsigned prerelease v1.0.0-dev
run-name: L7 unsigned v1.0.0-dev commit=${{ inputs.candidate_commit }} tree=${{ inputs.candidate_tree }}

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact merged main commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      candidate_tree:
        description: Exact candidate tree (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions: {}

concurrency:
  group: unsigned-prerelease-v1.0.0-dev
  cancel-in-progress: false

env:
  L7_RELEASE_BASE: 5c23038e38a07b4f91f8ef38bbf163e061857910
  L7_RELEASE_VERSION: 1.0.0-dev
  L7_RELEASE_CHANNEL: development-candidate
  L7_RELEASE_TAG: v1.0.0-dev
  L7_RELEASE_TITLE: Level 7 Dev Loop v1.0.0-dev — UNSIGNED (NO DEVELOPER ID), NOT NOTARIZED

jobs:
  control:
    name: Refuse missing or drifted prerelease controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate controls before any environment job is eligible
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          test "$GITHUB_REPOSITORY" = addressanup/level7-dev-loop
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = anup19950725
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_COMMIT"

          environment=$(gh api "repos/${GITHUB_REPOSITORY}/environments/v1-prerelease")
          printf '%s' "$environment" | jq -e '
            .name == "v1-prerelease" and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([.protection_rules[] | select(.type == "required_reviewers")][0].prevent_self_review == true) and
            ([.protection_rules[] | select(.type == "required_reviewers")][0].reviewers | length) == 1 and
            ([.protection_rules[] | select(.type == "required_reviewers")][0].reviewers[0].type == "User") and
            ([.protection_rules[] | select(.type == "required_reviewers")][0].reviewers[0].reviewer.login == "addressanup") and
            ([.protection_rules[] | select(.type == "wait_timer")] | length) == 0 and
            ([.protection_rules[] | select(.type != "required_reviewers" and .type != "branch_policy")] | length) == 0' >/dev/null
          custom_rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/v1-prerelease/deployment_protection_rules")
          printf '%s' "$custom_rules" | jq -e '
            .total_count == 0 and (.custom_deployment_protection_rules | type == "array" and length == 0)' >/dev/null

          expected_run_name="L7 unsigned v1.0.0-dev commit=${CANDIDATE_COMMIT} tree=${CANDIDATE_TREE}"
          current_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          printf '%s' "$current_run" | jq -e \
            --arg id "$GITHUB_RUN_ID" --arg sha "$CANDIDATE_COMMIT" --arg title "$expected_run_name" '
            (.id | tostring) == $id and .event == "workflow_dispatch" and .run_attempt == 1 and
            .head_branch == "main" and .head_sha == $sha and .actor.login == "anup19950725" and
            .display_title == $title and ((.path | split("@")[0]) == ".github/workflows/unsigned-prerelease.yml")' >/dev/null
          dispatches=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/unsigned-prerelease.yml/runs?event=workflow_dispatch&head_sha=${CANDIDATE_COMMIT}&per_page=100" \
            --jq '.workflow_runs[]')
          printf '%s\n' "$dispatches" | jq -sce \
            --arg id "$GITHUB_RUN_ID" --arg sha "$CANDIDATE_COMMIT" --arg title "$expected_run_name" '
            length == 1 and (.[0].id | tostring) == $id and .[0].run_attempt == 1 and
            .[0].event == "workflow_dispatch" and .[0].head_branch == "main" and
            .[0].head_sha == $sha and .[0].actor.login == "anup19950725" and
            .[0].display_title == $title and
            ((.[0].path | split("@")[0]) == ".github/workflows/unsigned-prerelease.yml")' >/dev/null

          artifact_name="v1.0.0-dev-prepared-${CANDIDATE_COMMIT}"
          prior_artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")
          printf '%s' "$prior_artifacts" | jq -e '.total_count == 0 and (.artifacts | length) == 0' >/dev/null

          expect_absent() {
            local endpoint=$1 response status
            response=$(mktemp "$RUNNER_TEMP/l7-absent.XXXXXX")
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${endpoint}")
            test "$status" = 404
            rm -f -- "$response"
          }
          expect_absent "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0-dev"
          expect_absent "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0-dev"
          expect_absent "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0"
          expect_absent "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0"
          collision_count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq \
            '.[] | select(.tag_name == "v1.0.0-dev" or .tag_name == "v1.0.0") | .id' | wc -l | tr -d ' ')
          test "$collision_count" = 0

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0" --jq .object.sha)" = \
            5be180300a1131091a5a124004f2a19ac7effd53
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/5be180300a1131091a5a124004f2a19ac7effd53" --jq .object.sha)" = \
            9306d9f14c0ac9ecae58ac33667039b1a8f35703
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.1" --jq .object.sha)" = \
            1353a5b0089e8e3c2fdcd7ed591a875661f68b9c
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/1353a5b0089e8e3c2fdcd7ed591a875661f68b9c" --jq .object.sha)" = \
            6757cc34d3bf9e05599387101bfc643e1fe4fee3

          v010=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0")
          printf '%s' "$v010" | jq -e '
            .id == 379243492 and .tag_name == "v0.1.0" and .name == "v0.1.0" and
            .draft == false and .prerelease == false and .immutable == false and
            ([.assets[] | {id,name,size,digest,state}] | sort_by(.name)) == [
              {id:536443473,name:"level7-dev-loop-claude-0.1.0.zip",size:26793,digest:"sha256:9ad8a7156f2ba596db14c5561213ba4c45527d691f5aada885381d8f6945e064",state:"uploaded"},
              {id:536443481,name:"level7-dev-loop-claude-0.1.0.zip.sha256",size:99,digest:"sha256:5dece5bc1db7f199fca09817df4ad7b4dfeeaaedae98a7dcb10fcbf5970bb199",state:"uploaded"},
              {id:536443476,name:"level7-dev-loop-codex-0.1.0.zip",size:27413,digest:"sha256:02660da8451c0a00e808424943ae72be264d9266ad6b4a015be74b6ed4b70657",state:"uploaded"},
              {id:536443482,name:"level7-dev-loop-codex-0.1.0.zip.sha256",size:98,digest:"sha256:d4394dfa14e2b64ff1c3bc17d6c55d9a94c23a82c35ae4b2b6bc89337a5e480d",state:"uploaded"}
            ]' >/dev/null
          v011=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.1")
          printf '%s' "$v011" | jq -e '
            .id == 379330897 and .tag_name == "v0.1.1" and .name == "Level 7 Dev Loop v0.1.1" and
            .draft == false and .prerelease == false and .immutable == false and
            ([.assets[] | {id,name,size,digest,state}] | sort_by(.name)) == [
              {id:536792429,name:"level7-dev-loop-claude-0.1.1.zip",size:27227,digest:"sha256:0a589d5566ffb6498f0501f76cd198ac0100edc3570a07f094fe1de595241c49",state:"uploaded"},
              {id:536792433,name:"level7-dev-loop-claude-0.1.1.zip.sha256",size:99,digest:"sha256:e272f419ae7bd120fb448ba155bb1a36589ac96d92b321aee309ffd1adad6111",state:"uploaded"},
              {id:536792432,name:"level7-dev-loop-codex-0.1.1.zip",size:27847,digest:"sha256:58ec422efd1b672f3c5d2aa6d1e7672077fb7741c68abcc548179c188f329dba",state:"uploaded"},
              {id:536792430,name:"level7-dev-loop-codex-0.1.1.zip.sha256",size:98,digest:"sha256:b06fa36da0324d26cdf9e67cca16e4dac2697a2e49c0f80a8ace674712008bcb",state:"uploaded"}
            ]' >/dev/null
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          printf '%s' "$latest" | jq -e '
            .id == 379330897 and .tag_name == "v0.1.1" and .draft == false and .prerelease == false' >/dev/null


  prepare:
    name: Prepare explicitly unsigned and unnotarized assets
    needs: control
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      pr_harness_id: ${{ steps.preflight.outputs.pr_harness_id }}
      policy_id: ${{ steps.preflight.outputs.policy_id }}
      evaluate_id: ${{ steps.preflight.outputs.evaluate_id }}
      owner_review_id: ${{ steps.preflight.outputs.owner_review_id }}
      auditor_review_id: ${{ steps.preflight.outputs.auditor_review_id }}
      postmerge_harness_id: ${{ steps.preflight.outputs.postmerge_harness_id }}
    steps:
      - name: Refuse a rerun or changed dispatch identity
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = addressanup/level7-dev-loop
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = anup19950725
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"

      - name: Check out exact merged candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 1
          path: candidate
          persist-credentials: false

      - name: Fail closed on candidate, governance, or hosted evidence drift
        id: preflight
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_COMMIT"

          commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${CANDIDATE_COMMIT}")
          test "$(printf '%s' "$commit" | jq -r .tree.sha)" = "$CANDIDATE_TREE"
          pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_COMMIT}/pulls?per_page=100")
          pull=$(printf '%s' "$pulls" | jq -ce --arg commit "$CANDIDATE_COMMIT" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $commit)] | if length == 1 then .[0] else error("exact merged pull request not found") end')
          number=$(printf '%s' "$pull" | jq -r .number)
          pr_head=$(printf '%s' "$pull" | jq -r .head.sha)
          test "$(printf '%s' "$pull" | jq -r .base.sha)" = "$L7_RELEASE_BASE"
          test "$(printf '%s' "$pull" | jq -r .user.login)" = anup19950725
          test "$(printf '%s' "$pull" | jq -r .state)" = closed
          test "$(printf '%s' "$pull" | jq -r .merged_at)" != null
          test "$(printf '%s' "$pull" | jq -r .merge_commit_sha)" = "$CANDIDATE_COMMIT"
          test "$(printf '%s' "$pull" | jq -c '[.labels[].name] | sort')" = '["l7-risk-tier-3"]'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${pr_head}" --jq .tree.sha)" = "$CANDIDATE_TREE"
          printf '%s' "$commit" | jq -e \
            --arg base "$L7_RELEASE_BASE" --arg head "$pr_head" \
            '([.parents[].sha] == [$base,$head])' >/dev/null

          pr_branch=$(printf '%s' "$pull" | jq -r .head.ref)
          pr_title=$(printf '%s' "$pull" | jq -r .title)
          pr_harness_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/harness.yml/runs?event=pull_request&head_sha=${pr_head}&per_page=100")
          printf '%s' "$pr_harness_runs" | jq -e \
            --arg sha "$pr_head" --arg branch "$pr_branch" --arg title "$pr_title" '
            .total_count == 1 and (.workflow_runs | length) == 1 and
            .workflow_runs[0].event == "pull_request" and .workflow_runs[0].head_branch == $branch and
            .workflow_runs[0].head_sha == $sha and .workflow_runs[0].run_attempt == 1 and
            .workflow_runs[0].status == "completed" and .workflow_runs[0].conclusion == "success" and
            .workflow_runs[0].actor.login == "anup19950725" and .workflow_runs[0].display_title == $title and
            ((.workflow_runs[0].path | split("@")[0]) == ".github/workflows/harness.yml")' >/dev/null
          pr_harness_id=$(printf '%s' "$pr_harness_runs" | jq -r .workflow_runs[0].id)
          pr_harness_jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_harness_id}/jobs?per_page=100" --jq '.jobs[]')
          for name in \
            'Go 1.26.7 (baseline)' \
            'Go 1.27.0 (shadow)' \
            'CLI macOS 15 (arm64)' \
            'CLI macOS 15 (amd64)' \
            'CLI paired benchmark gate'
          do
            count=$(printf '%s\n' "$pr_harness_jobs" | jq -sc \
              --arg name "$name" --arg sha "$pr_head" '
              [.[] | select(.name == $name and .head_sha == $sha and .run_attempt == 1 and
                .status == "completed" and .conclusion == "success")] | length')
            test "$count" = 1
          done

          policy_runs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/policy.yml/runs?head_sha=${pr_head}&per_page=100" \
            --jq '.workflow_runs[]')
          latest_policy=$(printf '%s\n' "$policy_runs" | jq -sce '
            [.[] | select((.path | split("@")[0]) == ".github/workflows/policy.yml")] |
            sort_by([.created_at,.id]) |
            if length > 0 then last else error("trusted policy run absent") end')
          printf '%s' "$latest_policy" | jq -e \
            --arg sha "$pr_head" --arg branch "$pr_branch" --arg title "$pr_title" '
            (.event == "pull_request_review" or .event == "workflow_run" or .event == "pull_request_target") and
            .head_branch == $branch and .head_sha == $sha and .run_attempt == 1 and
            .status == "completed" and .conclusion == "success" and .display_title == $title and
            (.actor.login == "addressanup" or .actor.login == "apbusinessidentity-tech")' >/dev/null
          policy_id=$(printf '%s' "$latest_policy" | jq -r .id)
          policy_created=$(printf '%s' "$latest_policy" | jq -r .created_at)
          policy_updated=$(printf '%s' "$latest_policy" | jq -r .updated_at)
          policy_jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${policy_id}/jobs?per_page=100" --jq '.jobs[]')
          policy_job_count=$(printf '%s\n' "$policy_jobs" | jq -sc --arg sha "$pr_head" '
            [.[] | select(.name == "Trusted policy driver" and .head_sha == $sha and
              .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length')
          test "$policy_job_count" = 1
          evaluate_stream=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?per_page=100" --jq '.check_runs[]')
          evaluate=$(printf '%s\n' "$evaluate_stream" | jq -sce '
            [.[] | select(.name == "evaluate")] | sort_by([.started_at // .created_at,.id]) |
            if length > 0 then last else error("trusted policy check absent") end')
          printf '%s' "$evaluate" | jq -e \
            --arg sha "$pr_head" --arg created "$policy_created" --arg updated "$policy_updated" '
            .head_sha == $sha and .app.slug == "github-actions" and .status == "completed" and
            .conclusion == "success" and .started_at >= $created and .completed_at <= $updated' >/dev/null
          evaluate_id=$(printf '%s' "$evaluate" | jq -er '.id | tostring')
          review_stream=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${number}/reviews?per_page=100" --jq '.[]')
          owner_review_id=
          auditor_review_id=
          for reviewer in addressanup apbusinessidentity-tech
          do
            review=$(printf '%s\n' "$review_stream" | jq -sce --arg reviewer "$reviewer" \
              '[.[] | select(.user.login == $reviewer)] | sort_by(.submitted_at // "") | if length > 0 then last else error("required review absent") end')
            test "$(printf '%s' "$review" | jq -r .commit_id)" = "$pr_head"
            test "$(printf '%s' "$review" | jq -r .state)" = APPROVED
            review_id=$(printf '%s' "$review" | jq -er '.id | tostring')
            case "$reviewer" in
              addressanup) owner_review_id=$review_id ;;
              apbusinessidentity-tech) auditor_review_id=$review_id ;;
              *) exit 1 ;;
            esac
          done
          [[ "$owner_review_id" =~ ^[0-9]+$ ]]
          [[ "$auditor_review_id" =~ ^[0-9]+$ ]]

          harness_runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/harness.yml/runs?event=push&branch=main&head_sha=${CANDIDATE_COMMIT}&per_page=100")
          printf '%s' "$harness_runs" | jq -e --arg sha "$CANDIDATE_COMMIT" '
            .total_count == 1 and (.workflow_runs | length) == 1 and
            .workflow_runs[0].event == "push" and .workflow_runs[0].head_branch == "main" and
            .workflow_runs[0].head_sha == $sha and .workflow_runs[0].run_attempt == 1 and
            .workflow_runs[0].status == "completed" and .workflow_runs[0].conclusion == "success" and
            ((.workflow_runs[0].path | split("@")[0]) == ".github/workflows/harness.yml")' >/dev/null
          harness_id=$(printf '%s' "$harness_runs" | jq -r .workflow_runs[0].id)
          harness_jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${harness_id}/jobs?per_page=100" --jq '.jobs[]')
          for name in \
            'Go 1.26.7 (baseline)' \
            'Go 1.27.0 (shadow)' \
            'CLI macOS 15 (arm64)' \
            'CLI macOS 15 (amd64)'
          do
            count=$(printf '%s\n' "$harness_jobs" | jq -sc --arg name "$name" --arg sha "$CANDIDATE_COMMIT" \
              '[.[] | select(.name == $name and .head_sha == $sha and .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length')
            test "$count" = 1
          done
          paired_count=$(printf '%s\n' "$harness_jobs" | jq -sc --arg sha "$CANDIDATE_COMMIT" \
            '[.[] | select(.name == "CLI paired benchmark gate" and .head_sha == $sha and .run_attempt == 1 and .status == "completed" and .conclusion == "skipped")] | length')
          test "$paired_count" = 1

          expected_run_name="L7 unsigned v1.0.0-dev commit=${CANDIDATE_COMMIT} tree=${CANDIDATE_TREE}"
          dispatches=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/unsigned-prerelease.yml/runs?event=workflow_dispatch&head_sha=${CANDIDATE_COMMIT}&per_page=100" \
            --jq '.workflow_runs[]')
          printf '%s\n' "$dispatches" | jq -sce \
            --arg id "$GITHUB_RUN_ID" --arg sha "$CANDIDATE_COMMIT" --arg title "$expected_run_name" '
            length == 1 and (.[0].id | tostring) == $id and .[0].run_attempt == 1 and
            .[0].event == "workflow_dispatch" and .[0].head_branch == "main" and
            .[0].head_sha == $sha and .[0].actor.login == "anup19950725" and
            .[0].display_title == $title and
            ((.[0].path | split("@")[0]) == ".github/workflows/unsigned-prerelease.yml")' >/dev/null
          artifact_name="v1.0.0-dev-prepared-${CANDIDATE_COMMIT}"
          prior_artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")
          printf '%s' "$prior_artifacts" | jq -e '.total_count == 0 and (.artifacts | length) == 0' >/dev/null

          expect_absent() {
            local endpoint=$1 response status
            response=$(mktemp "$RUNNER_TEMP/l7-absent.XXXXXX")
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${endpoint}")
            test "$status" = 404
            rm -f -- "$response"
          }
          expect_absent "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0-dev"
          expect_absent "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0-dev"
          expect_absent "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0"
          expect_absent "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0"
          collision_count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq \
            '.[] | select(.tag_name == "v1.0.0-dev" or .tag_name == "v1.0.0") | .id' | wc -l | tr -d ' ')
          test "$collision_count" = 0
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          printf '%s' "$latest" | jq -e '
            .id == 379330897 and .tag_name == "v0.1.1" and .draft == false and .prerelease == false' >/dev/null
          echo "pull-request=$number" >> "$GITHUB_OUTPUT"
          echo "pr_harness_id=$pr_harness_id" >> "$GITHUB_OUTPUT"
          echo "policy_id=$policy_id" >> "$GITHUB_OUTPUT"
          echo "evaluate_id=$evaluate_id" >> "$GITHUB_OUTPUT"
          echo "owner_review_id=$owner_review_id" >> "$GITHUB_OUTPUT"
          echo "auditor_review_id=$auditor_review_id" >> "$GITHUB_OUTPUT"
          echo "postmerge_harness_id=$harness_id" >> "$GITHUB_OUTPUT"

      - name: Materialize clean source and bootstrap pinned dependencies once
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          source_root="$RUNNER_TEMP/l7-v1.0.0-dev-source"
          test ! -e "$source_root"
          mkdir -m 0700 "$source_root"
          git -C candidate archive --format=tar "$CANDIDATE_COMMIT" | tar -xf - -C "$source_root"
          test ! -e "$source_root/.git"
          test -z "$(find "$source_root" -type l -print -quit)"
          make -C "$source_root" bootstrap-ci GO_VERSION=1.26.7

      - name: Build twice, classify signatures, and freeze exact assets
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.preflight.outputs.pull-request }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_RUN_ATTEMPT" = 1
          source_root="$RUNNER_TEMP/l7-v1.0.0-dev-source"
          first="$RUNNER_TEMP/l7-v1.0.0-dev-unsigned-first"
          test ! -e "$first"
          mkdir -m 0700 "$first"

          env -u GH_TOKEN make -C "$source_root" distribution GO_VERSION=1.26.7
          env -u GH_TOKEN make -C "$source_root" v1-inputs GO_VERSION=1.26.7 \
            L7_CLI_VERSION="$L7_RELEASE_VERSION" L7_PACKAGE_CHANNEL="$L7_RELEASE_CHANNEL"
          env -u GH_TOKEN make -C "$source_root" v1-package GO_VERSION=1.26.7 \
            L7_CLI_VERSION="$L7_RELEASE_VERSION" L7_PACKAGE_CHANNEL="$L7_RELEASE_CHANNEL"
          for relative in darwin-amd64/l7 darwin-amd64/l7-embed darwin-arm64/l7 darwin-arm64/l7-embed
          do
            test -f "$source_root/build/v1-inputs/$relative"
            test ! -L "$source_root/build/v1-inputs/$relative"
            mkdir -p "$first/${relative%/*}"
            cp -p "$source_root/build/v1-inputs/$relative" "$first/$relative"
          done
          mkdir "$first/packages"
          for host in claude codex
          do
            archive="$source_root/build/v1-candidate/level7-dev-loop-${L7_RELEASE_VERSION}-${host}.zip"
            test -f "$archive"
            test ! -L "$archive"
            cp -p "$archive" "$first/packages/"
          done
          test "$(find "$source_root/build/v1-inputs" -type f | wc -l | tr -d ' ')" = 4
          test "$(find "$source_root/build/v1-candidate" -type f | wc -l | tr -d ' ')" = 2

          input_root="$source_root/build/v1-inputs"
          package_root="$source_root/build/v1-candidate"
          case "$input_root" in "$source_root"/build/v1-inputs) rm -rf -- "$input_root" ;; *) exit 1 ;; esac
          case "$package_root" in "$source_root"/build/v1-candidate) rm -rf -- "$package_root" ;; *) exit 1 ;; esac
          env -u GH_TOKEN make -C "$source_root" v1-inputs GO_VERSION=1.26.7 \
            L7_CLI_VERSION="$L7_RELEASE_VERSION" L7_PACKAGE_CHANNEL="$L7_RELEASE_CHANNEL"
          env -u GH_TOKEN make -C "$source_root" v1-package GO_VERSION=1.26.7 \
            L7_CLI_VERSION="$L7_RELEASE_VERSION" L7_PACKAGE_CHANNEL="$L7_RELEASE_CHANNEL"
          for relative in darwin-amd64/l7 darwin-amd64/l7-embed darwin-arm64/l7 darwin-arm64/l7-embed
          do
            cmp "$first/$relative" "$input_root/$relative"
          done
          for host in claude codex
          do
            cmp "$first/packages/level7-dev-loop-${L7_RELEASE_VERSION}-${host}.zip" \
              "$package_root/level7-dev-loop-${L7_RELEASE_VERSION}-${host}.zip"
          done
          test "$(find "$input_root" -type f | wc -l | tr -d ' ')" = 4
          test "$(find "$package_root" -type f | wc -l | tr -d ' ')" = 2
          env -u GH_TOKEN make -C "$source_root" v1-package-check GO_VERSION=1.26.7 \
            L7_CLI_VERSION="$L7_RELEASE_VERSION" L7_PACKAGE_CHANNEL="$L7_RELEASE_CHANNEL"

          input_records='[]'
          for relative in darwin-amd64/l7 darwin-amd64/l7-embed darwin-arm64/l7 darwin-arm64/l7-embed
          do
            binary="$input_root/$relative"
            details="$RUNNER_TEMP/l7-signature-${relative//\//-}.txt"
            test ! -e "$details"
            if codesign --display --verbose=4 "$binary" >"$details" 2>&1; then
              grep -Fxq 'Signature=adhoc' "$details"
              grep -Eq '^CodeDirectory .*flags=.*adhoc' "$details"
              test "$(grep -Ec '^Authority=' "$details")" = 0
              if grep -Eq '^TeamIdentifier=' "$details"; then
                grep -Fxq 'TeamIdentifier=not set' "$details"
              fi
              if grep -Eq '^Timestamp=' "$details"; then
                grep -Fxq 'Timestamp=none' "$details"
              fi
              test "$(grep -Eic 'Developer ID|trusted timestamp' "$details")" = 0
              signature_state=AD_HOC
            else
              display_status=$?
              test "$display_status" -ne 0
              grep -Fq 'code object is not signed at all' "$details"
              test "$(grep -Ec '^Signature=|^Authority=|^TeamIdentifier=|^Timestamp=|^CodeDirectory ' "$details")" = 0
              signature_state=NONE
            fi
            input_sha=$(shasum -a 256 "$binary" | awk '{print $1}')
            input_records=$(jq -cn --argjson records "$input_records" --arg path "$relative" \
              --arg sha "$input_sha" --arg state "$signature_state" \
              '$records + [{path:$path,sha256:$sha,signature_state:$state}]')
          done
          printf '%s\n' "$input_records" | jq --sort-keys . > "$RUNNER_TEMP/l7-v1.0.0-dev-unsigned-inputs.json"
          jq -e '
            length == 4 and
            ([.[].path] == ["darwin-amd64/l7","darwin-amd64/l7-embed","darwin-arm64/l7","darwin-arm64/l7-embed"]) and
            all(.[]; (.sha256 | test("^[0-9a-f]{64}$")) and (.signature_state == "AD_HOC" or .signature_state == "NONE"))' \
            "$RUNNER_TEMP/l7-v1.0.0-dev-unsigned-inputs.json" >/dev/null

          extracted="$RUNNER_TEMP/l7-v1.0.0-dev-extracted"
          test ! -e "$extracted"
          mkdir -m 0700 "$extracted"
          for host in claude codex
          do
            mkdir "$extracted/$host"
            ditto -x -k "$package_root/level7-dev-loop-${L7_RELEASE_VERSION}-${host}.zip" "$extracted/$host"
            test -z "$(find "$extracted/$host" -type l -print -quit)"
            for relative in darwin-amd64/l7 darwin-amd64/l7-embed darwin-arm64/l7 darwin-arm64/l7-embed
            do
              cmp "$input_root/$relative" "$extracted/$host/bin/$relative"
            done
          done

          assets="$RUNNER_TEMP/l7-v1.0.0-dev-release-assets"
          test ! -e "$assets"
          mkdir -m 0700 "$assets"
          codex_name="level7-dev-loop-${L7_RELEASE_VERSION}-codex.zip"
          claude_name="level7-dev-loop-${L7_RELEASE_VERSION}-claude.zip"
          cp "$package_root/$codex_name" "$assets/"
          cp "$package_root/$claude_name" "$assets/"
          (
            cd "$assets"
            shasum -a 256 "$claude_name" "$codex_name" > SHA256SUMS
          )

          codex_sha=$(shasum -a 256 "$assets/$codex_name" | awk '{print $1}')
          claude_sha=$(shasum -a 256 "$assets/$claude_name" | awk '{print $1}')
          jq -n --sort-keys --arg claude "$claude_sha" --arg codex "$codex_sha" \
            '{"level7-dev-loop-1.0.0-dev-claude.zip":$claude,"level7-dev-loop-1.0.0-dev-codex.zip":$codex}' \
            > "$RUNNER_TEMP/l7-v1.0.0-dev-unsigned-packages.json"

          v010_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0")
          v010_tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/5be180300a1131091a5a124004f2a19ac7effd53")
          v010_release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0")
          v011_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.1")
          v011_tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/1353a5b0089e8e3c2fdcd7ed591a875661f68b9c")
          v011_release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.1")
          test "$(printf '%s' "$v010_ref" | jq -r .object.sha)" = 5be180300a1131091a5a124004f2a19ac7effd53
          test "$(printf '%s' "$v010_tag" | jq -r .object.sha)" = 9306d9f14c0ac9ecae58ac33667039b1a8f35703
          test "$(printf '%s' "$v011_ref" | jq -r .object.sha)" = 1353a5b0089e8e3c2fdcd7ed591a875661f68b9c
          test "$(printf '%s' "$v011_tag" | jq -r .object.sha)" = 6757cc34d3bf9e05599387101bfc643e1fe4fee3
          printf '%s' "$v010_release" | jq -e '
            .id == 379243492 and .draft == false and .prerelease == false and .immutable == false and
            ([.assets[] | {id,name,size,digest,state}] | sort_by(.name)) == [
              {id:536443473,name:"level7-dev-loop-claude-0.1.0.zip",size:26793,digest:"sha256:9ad8a7156f2ba596db14c5561213ba4c45527d691f5aada885381d8f6945e064",state:"uploaded"},
              {id:536443481,name:"level7-dev-loop-claude-0.1.0.zip.sha256",size:99,digest:"sha256:5dece5bc1db7f199fca09817df4ad7b4dfeeaaedae98a7dcb10fcbf5970bb199",state:"uploaded"},
              {id:536443476,name:"level7-dev-loop-codex-0.1.0.zip",size:27413,digest:"sha256:02660da8451c0a00e808424943ae72be264d9266ad6b4a015be74b6ed4b70657",state:"uploaded"},
              {id:536443482,name:"level7-dev-loop-codex-0.1.0.zip.sha256",size:98,digest:"sha256:d4394dfa14e2b64ff1c3bc17d6c55d9a94c23a82c35ae4b2b6bc89337a5e480d",state:"uploaded"}
            ]' >/dev/null
          printf '%s' "$v011_release" | jq -e '
            .id == 379330897 and .draft == false and .prerelease == false and .immutable == false and
            ([.assets[] | {id,name,size,digest,state}] | sort_by(.name)) == [
              {id:536792429,name:"level7-dev-loop-claude-0.1.1.zip",size:27227,digest:"sha256:0a589d5566ffb6498f0501f76cd198ac0100edc3570a07f094fe1de595241c49",state:"uploaded"},
              {id:536792433,name:"level7-dev-loop-claude-0.1.1.zip.sha256",size:99,digest:"sha256:e272f419ae7bd120fb448ba155bb1a36589ac96d92b321aee309ffd1adad6111",state:"uploaded"},
              {id:536792432,name:"level7-dev-loop-codex-0.1.1.zip",size:27847,digest:"sha256:58ec422efd1b672f3c5d2aa6d1e7672077fb7741c68abcc548179c188f329dba",state:"uploaded"},
              {id:536792430,name:"level7-dev-loop-codex-0.1.1.zip.sha256",size:98,digest:"sha256:b06fa36da0324d26cdf9e67cca16e4dac2697a2e49c0f80a8ace674712008bcb",state:"uploaded"}
            ]' >/dev/null
          v010_normalized=$(printf '%s' "$v010_release" | jq -c \
            '{id,tag_name,target_commitish,name,body,draft,prerelease,immutable,created_at,published_at,assets:([.assets[]|{id,name,size,digest,state}]|sort_by(.name))}')
          v011_normalized=$(printf '%s' "$v011_release" | jq -c \
            '{id,tag_name,target_commitish,name,body,draft,prerelease,immutable,created_at,published_at,assets:([.assets[]|{id,name,size,digest,state}]|sort_by(.name))}')
          jq -n --sort-keys \
            --arg v010_tag_object 5be180300a1131091a5a124004f2a19ac7effd53 \
            --arg v010_commit 9306d9f14c0ac9ecae58ac33667039b1a8f35703 \
            --argjson v010_release "$v010_normalized" \
            --arg v011_tag_object 1353a5b0089e8e3c2fdcd7ed591a875661f68b9c \
            --arg v011_commit 6757cc34d3bf9e05599387101bfc643e1fe4fee3 \
            --argjson v011_release "$v011_normalized" \
            '{"v0.1.0":{tag_object:$v010_tag_object,commit:$v010_commit,release:$v010_release},"v0.1.1":{tag_object:$v011_tag_object,commit:$v011_commit,release:$v011_release}}' \
            > "$RUNNER_TEMP/l7-v1.0.0-dev-retained-releases.json"

          checksums_sha=$(shasum -a 256 "$assets/SHA256SUMS" | awk '{print $1}')
          notes_sha=$(shasum -a 256 "$source_root/docs/releases/v1.0.0-dev.md" | awk '{print $1}')
          jq -n --sort-keys \
            --arg change_id l7-v1-explicitly-unsigned-prerelease \
            --arg version "$L7_RELEASE_VERSION" \
            --arg channel "$L7_RELEASE_CHANNEL" \
            --arg tag "$L7_RELEASE_TAG" \
            --arg base "$L7_RELEASE_BASE" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg tree "$CANDIDATE_TREE" \
            --argjson pull_request "$PULL_REQUEST" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg codex_name "$codex_name" \
            --arg codex_sha "$codex_sha" \
            --argjson codex_size "$(stat -f %z "$assets/$codex_name")" \
            --arg claude_name "$claude_name" \
            --arg claude_sha "$claude_sha" \
            --argjson claude_size "$(stat -f %z "$assets/$claude_name")" \
            --arg checksums_sha "$checksums_sha" \
            --argjson checksums_size "$(stat -f %z "$assets/SHA256SUMS")" \
            --arg notes_sha "$notes_sha" \
            --slurpfile unsigned_inputs "$RUNNER_TEMP/l7-v1.0.0-dev-unsigned-inputs.json" \
            --slurpfile unsigned_packages "$RUNNER_TEMP/l7-v1.0.0-dev-unsigned-packages.json" \
            --slurpfile retained_releases "$RUNNER_TEMP/l7-v1.0.0-dev-retained-releases.json" \
            '{schema:1,change_id:$change_id,version:$version,channel:$channel,tag:$tag,candidate:{base:$base,commit:$commit,tree:$tree,pull_request:$pull_request},workflow:{repository:$repository,run_id:$run_id,run_attempt:$run_attempt},unsigned_inputs:$unsigned_inputs[0],unsigned_packages:$unsigned_packages[0],artifacts:[{name:$claude_name,sha256:$claude_sha,size:$claude_size},{name:$codex_name,sha256:$codex_sha,size:$codex_size}],checksums:{name:"SHA256SUMS",sha256:$checksums_sha,size:$checksums_size},release_notes:{path:"docs/releases/v1.0.0-dev.md",sha256:$notes_sha},retained_releases:$retained_releases[0],artifact_state:"unsigned-prerelease-prepared",developer_id_signing:"NOT_PERFORMED",distribution_purpose:"EVALUATION_ONLY",gatekeeper:"MAY_BLOCK",notarization:"NOT_PERFORMED",actual_host_lifecycle_at_preparation:"NOT_RUN",provider_execution:"NOT_RUN",provider_qualification:"NOT_CLAIMED",stable_v1_evidence_or_authority:"DOES_NOT_SATISFY_OR_TRANSFER",support:"WITHHELD",post_preparation_host_evidence_required:true,authority:"external-only",publication_blocked:true,next:"complete exact-asset host-only trials, hosted owner authorization, and protected prerelease approval"}' \
            > "$assets/UNSIGNED-PRERELEASE-MANIFEST.json"

          expected=$(printf '%s\n' SHA256SUMS UNSIGNED-PRERELEASE-MANIFEST.json "$claude_name" "$codex_name" | sort)
          observed=$(find "$assets" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$observed" = "$expected"
          test -z "$(find "$assets" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find "$assets" -type f -size +300M -print -quit)"
          test "$(find "$assets" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          grep -Fxq '# Level 7 Dev Loop v1.0.0-dev — UNSIGNED (NO DEVELOPER ID), NOT NOTARIZED' \
            "$source_root/docs/releases/v1.0.0-dev.md"

      - name: Revalidate the one-shot boundary before external attestations
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR_HARNESS_ID: ${{ steps.preflight.outputs.pr_harness_id }}
          EXPECTED_POLICY_ID: ${{ steps.preflight.outputs.policy_id }}
          EXPECTED_EVALUATE_ID: ${{ steps.preflight.outputs.evaluate_id }}
          EXPECTED_OWNER_REVIEW_ID: ${{ steps.preflight.outputs.owner_review_id }}
          EXPECTED_AUDITOR_REVIEW_ID: ${{ steps.preflight.outputs.auditor_review_id }}
          EXPECTED_POSTMERGE_HARNESS_ID: ${{ steps.preflight.outputs.postmerge_harness_id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_COMMIT"

          assets="$RUNNER_TEMP/l7-v1.0.0-dev-release-assets"
          manifest="$assets/UNSIGNED-PRERELEASE-MANIFEST.json"

          commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${CANDIDATE_COMMIT}")
          test "$(printf '%s' "$commit" | jq -r .tree.sha)" = "$CANDIDATE_TREE"
          pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_COMMIT}/pulls?per_page=100")
          pull=$(printf '%s' "$pulls" | jq -ce --arg commit "$CANDIDATE_COMMIT" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $commit)] | if length == 1 then .[0] else error("exact merged pull request not found") end')
          number=$(printf '%s' "$pull" | jq -r .number)
          pr_head=$(printf '%s' "$pull" | jq -r .head.sha)
          test "$number" = "$(jq -r .candidate.pull_request "$manifest")"
          test "$(printf '%s' "$pull" | jq -r .base.sha)" = "$L7_RELEASE_BASE"
          test "$(printf '%s' "$pull" | jq -r .user.login)" = anup19950725
          test "$(printf '%s' "$pull" | jq -r .state)" = closed
          test "$(printf '%s' "$pull" | jq -r .merged_at)" != null
          test "$(printf '%s' "$pull" | jq -r .merge_commit_sha)" = "$CANDIDATE_COMMIT"
          test "$(printf '%s' "$pull" | jq -c '[.labels[].name] | sort')" = '["l7-risk-tier-3"]'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${pr_head}" --jq .tree.sha)" = "$CANDIDATE_TREE"
          printf '%s' "$commit" | jq -e \
            --arg base "$L7_RELEASE_BASE" --arg head "$pr_head" \
            '([.parents[].sha] == [$base,$head])' >/dev/null

          pr_branch=$(printf '%s' "$pull" | jq -r .head.ref)
          pr_title=$(printf '%s' "$pull" | jq -r .title)
          pr_harness_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/harness.yml/runs?event=pull_request&head_sha=${pr_head}&per_page=100")
          printf '%s' "$pr_harness_runs" | jq -e \
            --arg sha "$pr_head" --arg branch "$pr_branch" --arg title "$pr_title" '
            .total_count == 1 and (.workflow_runs | length) == 1 and
            .workflow_runs[0].event == "pull_request" and .workflow_runs[0].head_branch == $branch and
            .workflow_runs[0].head_sha == $sha and .workflow_runs[0].run_attempt == 1 and
            .workflow_runs[0].status == "completed" and .workflow_runs[0].conclusion == "success" and
            .workflow_runs[0].actor.login == "anup19950725" and .workflow_runs[0].display_title == $title and
            ((.workflow_runs[0].path | split("@")[0]) == ".github/workflows/harness.yml")' >/dev/null
          pr_harness_id=$(printf '%s' "$pr_harness_runs" | jq -r .workflow_runs[0].id)
          pr_harness_jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_harness_id}/jobs?per_page=100" --jq '.jobs[]')
          for name in \
            'Go 1.26.7 (baseline)' \
            'Go 1.27.0 (shadow)' \
            'CLI macOS 15 (arm64)' \
            'CLI macOS 15 (amd64)' \
            'CLI paired benchmark gate'
          do
            count=$(printf '%s\n' "$pr_harness_jobs" | jq -sc \
              --arg name "$name" --arg sha "$pr_head" '
              [.[] | select(.name == $name and .head_sha == $sha and .run_attempt == 1 and
                .status == "completed" and .conclusion == "success")] | length')
            test "$count" = 1
          done

          policy_runs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/policy.yml/runs?head_sha=${pr_head}&per_page=100" \
            --jq '.workflow_runs[]')
          latest_policy=$(printf '%s\n' "$policy_runs" | jq -sce '
            [.[] | select((.path | split("@")[0]) == ".github/workflows/policy.yml")] |
            sort_by([.created_at,.id]) |
            if length > 0 then last else error("trusted policy run absent") end')
          printf '%s' "$latest_policy" | jq -e \
            --arg sha "$pr_head" --arg branch "$pr_branch" --arg title "$pr_title" '
            (.event == "pull_request_review" or .event == "workflow_run" or .event == "pull_request_target") and
            .head_branch == $branch and .head_sha == $sha and .run_attempt == 1 and
            .status == "completed" and .conclusion == "success" and .display_title == $title and
            (.actor.login == "addressanup" or .actor.login == "apbusinessidentity-tech")' >/dev/null
          policy_id=$(printf '%s' "$latest_policy" | jq -r .id)
          policy_created=$(printf '%s' "$latest_policy" | jq -r .created_at)
          policy_updated=$(printf '%s' "$latest_policy" | jq -r .updated_at)
          policy_jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${policy_id}/jobs?per_page=100" --jq '.jobs[]')
          policy_job_count=$(printf '%s\n' "$policy_jobs" | jq -sc --arg sha "$pr_head" '
            [.[] | select(.name == "Trusted policy driver" and .head_sha == $sha and
              .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length')
          test "$policy_job_count" = 1
          evaluate_stream=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?per_page=100" --jq '.check_runs[]')
          evaluate=$(printf '%s\n' "$evaluate_stream" | jq -sce '
