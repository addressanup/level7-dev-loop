            .[0].event == "workflow_dispatch" and .[0].head_branch == "main" and
            .[0].head_sha == $sha and .[0].actor.login == "anup19950725" and
            .[0].display_title == $title and
            ((.[0].path | split("@")[0]) == ".github/workflows/unsigned-prerelease.yml")' >/dev/null

