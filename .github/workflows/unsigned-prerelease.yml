          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")
          printf '%s' "$artifact" | jq -e \
            --arg id "$ARTIFACT_ID" --arg name "$artifact_name" --arg run "$GITHUB_RUN_ID" --arg sha "$CANDIDATE_COMMIT" '
            (.id | tostring) == $id and .name == $name and .expired == false and .size_in_bytes > 0 and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $sha' >/dev/null
