name: Trusted policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Check out candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Build trusted controller only
        working-directory: trusted
        run: |
          make bootstrap
          go_version=$(sed -n '1p' .go-version)
          ".cache/toolchains/go${go_version}/bin/go" build -trimpath -o ../l7-policy ./internal/harness/buildcontrol

      - name: Derive trusted review envelopes
        env:
          GH_TOKEN: ${{ github.token }}
          L7_ACCOUNTABLE_OWNER: ${{ vars.L7_ACCOUNTABLE_OWNER }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          brief=$(git -C candidate diff --diff-filter=A --name-only "${{ github.event.pull_request.base.sha }}..${PR_HEAD}" -- 'docs/artifacts/changes/*.md' | grep -Ev -- '-(verification|audit)\.md$' | head -n 1 || true)
          if [ -z "$brief" ]; then
            exit 0
          fi
          change_id=$(basename "$brief" .md)
          brief_commit=$(git -C candidate log --diff-filter=A -1 --format=%H "$PR_HEAD" -- "$brief")
          reviews=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews")
          owner=$(printf '%s' "$reviews" | jq -r --arg actor "$L7_ACCOUNTABLE_OWNER" --arg head "$PR_HEAD" '[.[] | select(.state == "APPROVED" and .user.login == $actor and .commit_id == $head)] | last | .user.login // empty')
          auditor=$(printf '%s' "$reviews" | jq -r --arg owner "$owner" --arg author "$PR_AUTHOR" --arg head "$PR_HEAD" '[.[] | select(.state == "APPROVED" and .user.login != $owner and .user.login != $author and .commit_id == $head)] | last | .user.login // empty')
          if [ -n "$owner" ]; then
            mkdir -p "candidate/.git/l7/approvals"
            jq -n --arg id "$change_id" --arg actor "$owner" --arg implementer "$PR_AUTHOR" --arg brief "$brief_commit" '{schema:1,change_id:$id,actor:$actor,implementer:$implementer,brief_commit:$brief,source:"trusted-ci"}' > "candidate/.git/l7/approvals/${change_id}.json"
          fi
          if [ -n "$auditor" ]; then
            audit="docs/artifacts/changes/${change_id}-audit.md"
            if [ -f "candidate/$audit" ]; then
              # shellcheck disable=SC2016
              candidate_commit=$(awk -F '|' '$2 ~ /Candidate commit/ {gsub(/[ `]/, "", $3); print $3}' "candidate/$audit")
              mkdir -p "candidate/.git/l7/audits"
              jq -n --arg id "$change_id" --arg actor "$auditor" --arg candidate "$candidate_commit" --arg audit "$PR_HEAD" '{schema:1,change_id:$id,actor:$actor,candidate_commit:$candidate,audit_commit:$audit,source:"trusted-ci"}' > "candidate/.git/l7/audits/${change_id}.json"
            fi
          fi

      - name: Evaluate candidate with trusted base controller
        env:
          GH_TOKEN: ${{ github.token }}
          L7_ACCOUNTABLE_OWNER: ${{ vars.L7_ACCOUNTABLE_OWNER }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="$PR_HEAD"
          risk_labels=$(jq -r '[.pull_request.labels[].name | select(test("^l7-risk-tier-[123]$"))] | unique | .[]' "$GITHUB_EVENT_PATH")
          test "$(printf '%s\n' "$risk_labels" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 || { echo 'exactly one trusted l7-risk-tier-1/2/3 label is required' >&2; exit 1; }
          risk=${risk_labels##*-}

          checks=$(gh api "repos/${REPOSITORY}/commits/${head}/check-runs")
          baseline=$(printf '%s' "$checks" | jq '[.check_runs[] | select(.name | test("^Go .* \\(baseline\\)$")) | select(.conclusion == "success")] | length')
          macos_arm64=$(printf '%s' "$checks" | jq '[.check_runs[] | select(.name == "CLI macOS 15 (arm64)") | select(.conclusion == "success")] | length')
          macos_amd64=$(printf '%s' "$checks" | jq '[.check_runs[] | select(.name == "CLI macOS 15 (amd64)") | select(.conclusion == "success")] | length')
          benchmark_success=$(printf '%s' "$checks" | jq '[.check_runs[] | select(.name == "CLI paired benchmark gate") | select(.conclusion == "success")] | length')
          benchmark_failure=$(printf '%s' "$checks" | jq '[.check_runs[] | select(.name == "CLI paired benchmark gate") | select(.conclusion == "failure")] | length')
          reviews=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews")
          reviewer=$(printf '%s' "$reviews" | jq -r --arg author "$PR_AUTHOR" --arg head "$head" '[.[] | select(.state == "APPROVED" and .user.login != $author and .commit_id == $head)] | last | .user.login // empty')
          benchmark_marker="L7-Benchmark-Regression-Accepted: $head"
          benchmark_acceptance=$(printf '%s' "$reviews" | jq --arg actor "$L7_ACCOUNTABLE_OWNER" --arg head "$head" --arg marker "$benchmark_marker" '[.[] | select(.state == "APPROVED" and .user.login == $actor and .commit_id == $head) | select(any(((.body // "") | split("\n"))[]; . == $marker or . == ($marker + "\r")))] | length')
          benchmark_current=false
          if [ "$benchmark_success" -gt 0 ]; then
            benchmark_current=true
          elif [ "$benchmark_failure" -gt 0 ] && [ "$benchmark_acceptance" -gt 0 ]; then
            benchmark_current=true
            echo "accountable owner explicitly accepted the paired benchmark regression at $head"
          fi
          verified_ref=
          review_ref=
          ready_ref=
          if [ "$baseline" -gt 0 ] && [ "$macos_arm64" -gt 0 ] && [ "$macos_amd64" -gt 0 ] && [ "$benchmark_current" = true ]; then verified_ref=$head; fi
          if [ -n "$reviewer" ]; then review_ref=$head; fi
          if [ -n "$verified_ref" ] && [ -n "$review_ref" ]; then ready_ref=$head; fi

          if [ "$risk" = 1 ]; then
            scope=$(printf '%s\n' "$PR_BODY" | sed -n 's/^L7-Scope: //p')
            test -n "$scope" || { echo 'Tier 1 requires one explicit L7-Scope line in PR metadata' >&2; exit 1; }
            L7_VERIFIED_REF=$verified_ref L7_REVIEW_REF=$review_ref L7_READY_REF=$ready_ref ./l7-policy --repo candidate --base "$base" --head "$head" --tier 1 --scope "$scope" --require-ready
          elif [ "$risk" = 3 ]; then
            L7_AUDIT_REQUEST_REF=$head L7_READY_REF=$ready_ref ./l7-policy --repo candidate --base "$base" --head "$head" --tier 3 --require-ready
          else
            L7_VERIFIED_REF=$verified_ref L7_REVIEW_REF=$review_ref L7_READY_REF=$ready_ref ./l7-policy --repo candidate --base "$base" --head "$head" --tier 2 --require-ready
          fi
